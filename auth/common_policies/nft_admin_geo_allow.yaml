name: policy nft-admin-geo-allow v1.1
desc: |
  Combined policy: geo allowlist + NFT ownership + admin bypass.

  Only users whose IP resolves to a country in authorizedCountryCodes may access.
  Admins (tenant_admin or content_admin group members) are allowed for any geo.
  Non-admin users must pass the geo check AND own a qualifying NFT.  NFT ownership is confirmed
  either by isOwnerOfLinkedNft checking on-chain assets, or, by hasAssetClaimForLinkedNft accepting
  an embedded, authority-signed entitlement bridge claim (ctx["elv:asset_claims"]) asserting
  pending ownership.

  Entry point is named 'authorize' for CSAT compatibility.
type: ast
expr:
  rule: authorize
rules:

  settings:
    literal:
      authorizedCountryCodes:
        - "CA"
      authorized_asset_claims_signers:
        - "0x2b35120282a443e34D76b125F05be497365BDDBf"
        - "0xdD0402bb72FA5554BB79a84ABC8a59E1b8Df4F45"

  authorize:
    or:
      - rule: isAdminUser
      - and:
          - rule: isAllowedRegion
          - rule: main

  isAllowedRegion:
    in:
      - fn.ipGeoLocationProps:
          - "country_code"
      - rule: settings/authorizedCountryCodes

  isAdminUser:
    or:
      - func: userIsTenantAdmin
      - func: userIsContentAdmin

  main:
    or:
      - fn.isOwnerOfLinkedNft:
          - env: call/subject
      - fn.hasAssetClaimForLinkedNft:
      - and:
          - eq:
              - env: api_call/action
              - q.read.decrypt
          - fn.ids.Equivalent:
              - env: call/node_id
              - env: call/subject
